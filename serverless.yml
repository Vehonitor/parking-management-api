service: parking-management-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.10
  stage: ${opt:stage, 'preprod'}
  region: us-east-1

  environment:
    # JWT
    JWT_SECRET: ${ssm:/parking/${self:provider.stage}/JWT_SECRET, 'supersecretkey123'}
    JWT_ALGORITHM: ${ssm:/parking/${self:provider.stage}/JWT_ALGORITHM, 'HS256'}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ssm:/parking/${self:provider.stage}/ACCESS_TOKEN_EXPIRE_MINUTES, 30}

    # Database
    DATABASE_URL: ${ssm:/parking/${self:provider.stage}/DATABASE_URL, 'postgresql://user:pass@localhost:5432/postgres'}
    DB_USER: ${ssm:/parking/${self:provider.stage}/DB_USER, 'parkidam_user'}
    DB_PASSWORD: ${ssm:/parking/${self:provider.stage}/DB_PASSWORD, 'parkidam_pass'}
    DB_HOST: ${ssm:/parking/${self:provider.stage}/DB_HOST, 'localhost'}
    DB_PORT: ${ssm:/parking/${self:provider.stage}/DB_PORT, 5432}
    DB_NAME: ${ssm:/parking/${self:provider.stage}/DB_NAME, 'postgres'}

    # Twilio
    TWILIO_ACCOUNT_SID: ${ssm:/parking/${self:provider.stage}/TWILIO_ACCOUNT_SID, 'default_sid'}
    TWILIO_AUTH_TOKEN: ${ssm:/parking/${self:provider.stage}/TWILIO_AUTH_TOKEN, 'default_token'}
    TWILIO_FROM_NUMBER: ${ssm:/parking/${self:provider.stage}/TWILIO_FROM_NUMBER, '+10000000000'}

    # App configuration
    DEBUG: ${ssm:/parking/${self:provider.stage}/DEBUG, true}
    STAGE: ${self:provider.stage}
    OTP_EXPIRY_MINUTES: ${ssm:/parking/${self:provider.stage}/OTP_EXPIRY_MINUTES, 10}
    OTP_LENGTH: ${ssm:/parking/${self:provider.stage}/OTP_LENGTH, 6}
    APP_NAME: ${ssm:/parking/${self:provider.stage}/APP_NAME, 'Parking Management API'}

package:
  patterns:
    - '!venv/**'
    - '!node_modules/**'
    - '!__pycache__/**'
    - '!tests/**'
    - '!*.test.py'
    - '**/*.py'
    - 'services/**'
    - 'utils/**'
    - 'static/**'

functions:
  app:
    handler: src.main.handler
    events:
      - httpApi: '*'

plugins:
  - serverless-python-requirements
  - serverless-offline
  - serverless-plugin-warmup

custom:
  pythonRequirements:
    dockerizePip: true
    layer: true
    slim: true

  warmup:
    default:
      enabled: false
      timeout: 10
      memorySize: 128
