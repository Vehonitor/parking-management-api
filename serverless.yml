service: parking-management-api
provider:
  name: aws
  runtime: python3.10
  memorySize: 512
  timeout: 30
  environment:
    GOOGLE_MAPS_API_KEY: 
    RAZORPAY_KEY_ID: 
    RAZORPAY_KEY_SECRET: 
    DYNAMODB_TABLE_USER: 
    DYNAMODB_TABLE_PARKING: 
    DYNAMODB_TABLE_BOOKING: 
    S3_BUCKET: 
    JWT_SECRET: 
  iamRoleStatements:
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - s3:PutObject
        - s3:GetObject
      Resource: "*"
functions:
  api:
    handler: handler.lambda_handler
    events:
      - http:
          path: api/v1/{proxy+}
          method: any
plugins:
  - serverless-python-requirements
  - serverless-offline
  - serverless-domain-manager
  - serverless-plugin-warmup
custom:
  customDomain:
    domainName: api-parking.com
    certificateName: your-certificate-name
    stage: prod