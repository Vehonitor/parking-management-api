service: 'parking-management-api'

frameworkVersion: "3"
variablesResolutionMode: 20210326

provider:
  name: aws
  runtime: python3.10
  stage: ${opt:stage, 'preprod'}
  region: us-east-1
  timeout: 30
  memorySize: 512

  environment:
    # TWILIO_ACCOUNT_SID: ${ssm:/${self:provider.stage}/twilio/account_sid}
    # TWILIO_AUTH_TOKEN: ${ssm:/${self:provider.stage}/twilio/auth_token}
    # OPENAI_API_KEY: ${ssm:/${self:provider.stage}/openai/api_key}
    S3_BUCKET: "https://content-preprod-parkidem/"
    STAGE: "preprod"

  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "s3:GetObject"
        - "s3:ListBucket"
      Resource: "*"  # temporary, replace with your bucket ARN later
    - Effect: "Allow"
      Action:
        - "logs:CreateLogGroup"
        - "logs:CreateLogStream"
        - "logs:PutLogEvents"
      Resource: "*"
    - Effect: "Allow"
      Action:
        - "lambda:InvokeFunction"
      Resource: "*"


functions:
  api:
    handler: handler.handler
    events:
      - http:
          path: /openapi.json
          method: GET
          cors: true
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true

plugins:
  - serverless-python-requirements
  - serverless-offline
  - serverless-plugin-warmup

# custom:
#   pythonRequirements:
#     dockerizePip: false
#     slim: true
#     zip: true  
#     layer: true
custom:
  pythonRequirements:
    pythonBin: py
    dockerizePip: false
    slim: true
    zip: true
    layer: true
    useStaticCache: false
    useDownloadCache: false
    copy: true

  warmup:
    default:
      enabled: false

  # warmup:
  #   default:
  #     enabled: false
  #     timeout: 10
  #     memorySize: 128

  # customDomain:
  #   domainName: api${file(./env/${self:provider.stage}.json):API_PREFIX}.parkidam.com
  #   basePath: "v3"
  #   stage: ${self:provider.stage}
  #   createRoute53Record: true


package:
  patterns:
    - '!venv/**'
    - '!node_modules/**'
    - '!__pycache__/**'
    - '!tests/**'
    - '!*.test.py'
    - '**/*.py'
    - 'services/**'
    - 'utils/**'
    - 'static/**'
